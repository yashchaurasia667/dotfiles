[opener]
  xdg = [ { run = "xdg-open %s", orphan = true, desc = "open with xdg-open" } ]
  img = [ { run = "imv %s .", orphan = true, desc = "open"} ]
  txt = [ { run = "nvim %s", block = true, desc = "open with nvim" } ]

[open]
  rules = [
    { mime = "image/*", use = "img" },
    { mime = "video/*", use = "xdg" },
    { mime = "text/*", use = "txt" },
    { mime = "application/pdf", use = "xdg" },
    { mime = "application/epub+zip", use = "xdg" },
    { mime = "*", use = "xdg" },
  ]
